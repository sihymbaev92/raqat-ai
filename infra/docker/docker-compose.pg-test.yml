# Локальды pytest integration: migrate SQLite → PostgreSQL
# DSN: postgresql://postgres:postgres@127.0.0.1:5432/raqat_test
#
#   docker compose -f infra/docker/docker-compose.pg-test.yml up -d
#   bash scripts/run_pg_integration_tests.sh
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: raqat-pg-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raqat_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raqat_test"]
      interval: 3s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
