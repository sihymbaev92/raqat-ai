# After certbot (or place Cloudflare Origin cert paths):
#   ssl_certificate     /etc/letsencrypt/live/api.rahatomir.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/api.rahatomir.com/privkey.pem;
#
# HTTP→HTTPS redirect: use certbot nginx plugin or a separate server { listen 80; return 301 ... }

server {
    listen 443 ssl http2;
    server_name api.rahatomir.com;

    # ssl_certificate     /etc/letsencrypt/live/api.rahatomir.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.rahatomir.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
