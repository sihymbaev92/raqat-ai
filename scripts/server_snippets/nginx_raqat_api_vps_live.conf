# Platform API — тек api.rahatomir.com
# Веб-қолданба: nginx_raqat_web_app.conf (rahatomir.com + www)
#
# Certbot (барлық домен бір сертификат):
#   sudo certbot --nginx -d api.rahatomir.com -d rahatomir.com -d www.rahatomir.com

server {
    listen 80;
    listen [::]:80;
    server_name api.rahatomir.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rahatomir.com;

    ssl_certificate /etc/letsencrypt/live/api.rahatomir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rahatomir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location = / {
        return 302 /health;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
