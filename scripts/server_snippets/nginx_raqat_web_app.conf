# RAQAT Expo web — rahatomir.com + www (негізгі сайт)
# API бөлек: nginx_raqat_api_vps_live.conf → api.rahatomir.com
#
# Build: cd mobile && npm run export:web
# Жүктеу: bash scripts/vps_deploy_web.sh
#
# Certbot:
#   sudo certbot --nginx -d rahatomir.com -d www.rahatomir.com
# немесе api-мен бірге:
#   sudo certbot --nginx -d api.rahatomir.com -d rahatomir.com -d www.rahatomir.com

server {
    listen 80;
    listen [::]:80;
    server_name rahatomir.com www.rahatomir.com;

    location / {
        return 301 https://rahatomir.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rahatomir.com;

    ssl_certificate /etc/letsencrypt/live/api.rahatomir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rahatomir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://rahatomir.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rahatomir.com;

    ssl_certificate /etc/letsencrypt/live/api.rahatomir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rahatomir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/raqat-web/dist;
    index index.html;

    client_max_body_size 16m;
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    sendfile on;
    tcp_nopush on;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /_expo/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri.gz $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
